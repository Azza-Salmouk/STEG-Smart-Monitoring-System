version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: steg-postgres
    environment:
      POSTGRES_DB: steg_monitoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - steg-network

volumes:
  postgres_data:

networks:
  steg-network:
    driver: bridge
