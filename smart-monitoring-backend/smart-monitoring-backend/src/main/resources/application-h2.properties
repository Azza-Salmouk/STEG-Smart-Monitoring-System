spring.application.name=smart-monitoring-backend

# ==========================
# H2 Database Configuration (For Development/Testing)
# ==========================
spring.datasource.url=jdbc:h2:mem:steg_monitoring
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# Logging Configuration
# ==========================
logging.level.com.steg.smartmonitoring=DEBUG
logging.level.com.steg.smartmonitoring.prediction=DEBUG
logging.level.org.springframework.web=DEBUG

# ==========================
# Server Configuration
# ==========================
server.port=8081

# ==========================
# JWT Configuration
# ==========================
jwt.secret=${JWT_SECRET:dev-secret-key-NOT-FOR-PRODUCTION-CHANGE-THIS}
jwt.expiration=${JWT_EXPIRATION:86400000}
