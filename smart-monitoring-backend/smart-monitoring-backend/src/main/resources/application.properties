spring.application.name=smart-monitoring-backend

# ==========================
# Database Configuration - H2 for E2E Testing
# ==========================
spring.datasource.url=jdbc:h2:mem:steg_monitoring
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# Server Configuration
# ==========================
server.port=8081

# ==========================
# JWT Configuration
# IMPORTANT: Do NOT use default JWT_SECRET in production
# Provide a secure secret via JWT_SECRET environment variable
# Default is for development only
# ==========================
jwt.secret=${JWT_SECRET:dev-secret-key-NOT-FOR-PRODUCTION-CHANGE-THIS}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================
# Ollama Local LLM Configuration
# ==========================
# Base URL of local Ollama instance
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

# Model to use (default: qwen2.5:3b)
ollama.model=${OLLAMA_MODEL:qwen2.5:3b}

# Request timeout in milliseconds (120 seconds - accommodate longer inference times)
ollama.timeout=${OLLAMA_TIMEOUT:120000}

# Enable/disable chatbot feature
ollama.enable-chatbot=${OLLAMA_ENABLE_CHATBOT:true}

# Logging
logging.level.com.steg.smartmonitoring.ai=INFO
logging.level.com.steg.smartmonitoring.ai.service=DEBUG