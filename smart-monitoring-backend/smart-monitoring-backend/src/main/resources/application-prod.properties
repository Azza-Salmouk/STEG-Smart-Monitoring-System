# STEG Smart Monitoring - Production Configuration
# 
# This file is used for production deployments
# ALL sensitive values MUST be provided via environment variables
# NO secrets should be committed to the repository
#
# Required environment variables:
# - DB_URL: PostgreSQL connection URL
# - DB_USERNAME: PostgreSQL username
# - DB_PASSWORD: PostgreSQL password
# - JWT_SECRET: JWT signing secret (long, random, secure)
# - JWT_EXPIRATION: Token expiration in milliseconds (optional, default: 86400000 = 24h)

# ==========================
# Database Configuration
# MUST use environment variables in production
# ==========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================
# Server Configuration
# ==========================
server.port=8081

# ==========================
# JWT Configuration
# MUST provide JWT_SECRET environment variable in production
# ==========================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================
# Logging
# ==========================
logging.level.root=WARN
logging.level.com.steg.smartmonitoring=INFO
