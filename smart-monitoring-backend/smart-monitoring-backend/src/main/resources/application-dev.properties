# STEG Smart Monitoring - Development Configuration with PostgreSQL
# 
# This file is used for development when testing against a local PostgreSQL instance
# Configure the PostgreSQL connection details below

# ==========================
# Database Configuration (PostgreSQL)
# ==========================
# For local development with PostgreSQL
# Set environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/steg_monitoring}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==========================
# Server Configuration
# ==========================
server.port=8081

# ==========================
# JWT Configuration
# ==========================
jwt.secret=${JWT_SECRET:dev-secret-key-NOT-FOR-PRODUCTION-CHANGE-THIS}
jwt.expiration=86400000

# ==========================
# Logging
# ==========================
logging.level.root=INFO
logging.level.com.steg.smartmonitoring=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

